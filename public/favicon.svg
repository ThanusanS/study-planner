<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- High-visibility green-to-gold gradient, saturated for tiny favicon sizes -->
    <linearGradient id="logo-cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#059669" /> <!-- Deep Emerald Green -->
      <stop offset="100%" stopColor="#eab308" /> <!-- Rich Gold Yellow -->
    </linearGradient>
  </defs>

  <!-- Dark outline ring for contrast on both light and dark browser tabs -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="rgba(0,0,0,0.25)" strokeWidth="1"/>

  <!-- Solid Background Squircle -->
  <rect x="2" y="2" width="28" height="28" rx="7.5" fill="url(#logo-cap-grad)" />

  <!-- Inner highlight for depth -->
  <rect x="3" y="3" width="26" height="14" rx="6" fill="rgba(255,255,255,0.15)" />

  <!-- Graduation Cap Diamond Top -->
  <path
    d="M 6,13 L 16,8.5 L 26,13 L 16,17.5 Z"
    fill="rgba(255, 255, 255, 0.2)"
    stroke="#ffffff"
    strokeWidth="2.2"
    strokeLinejoin="round"
  />

  <!-- Graduation Cap Skullcap Base -->
  <path
    d="M 10.5,15.5 V 18.5 C 10.5,20.5 12.8,21.5 16,21.5 C 19.2,21.5 21.5,20.5 21.5,18.5 V 15.5"
    stroke="#ffffff"
    strokeWidth="2.2"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  <!-- Tassel -->
  <path
    d="M 22,12.5 L 24,15 V 19 C 24,19.8 23.5,20.2 22.7,20.2"
    stroke="#ffffff"
    strokeWidth="1.8"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  <!-- AI Sparkle / Magic Star -->
  <path
    d="M 16,10.5 C 16,12.2 15.5,12.7 14,12.7 C 15.5,12.7 16,13.2 16,15 C 16,13.2 16.5,12.7 18,12.7 C 16.5,12.7 16,12.2 16,10.5 Z"
    fill="#ffffff"
  />
</svg>

